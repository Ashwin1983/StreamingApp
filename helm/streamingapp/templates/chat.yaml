apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.replicaCount.chat }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: {{ .Values.image.registry }}/streaming-chat:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.chat.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.services.chat.port | quote }}
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: MONGO_URI
            - name: CLIENT_URL
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: CLIENT_URL
            - name: CLIENT_URLS
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: CLIENT_URLS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jwt.secretName }}
                  key: {{ .Values.jwt.secretKey }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.services.chat.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.services.chat.port }}
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: {{ .Values.global.namespace }}
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.chat.port }}
      targetPort: {{ .Values.services.chat.port }}
      name: http
  selector:
    app: chat-service