apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-service
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.replicaCount.streaming }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: streaming-service
  template:
    metadata:
      annotations:
        deployment-revision: "3"
      labels:
        app: streaming-service
    spec:
      serviceAccountName: streaming-service-sa
      containers:
        - name: streaming-service
          image: {{ .Values.image.registry }}/streaming-stream:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.streaming.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.services.streaming.port | quote }}
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: MONGO_URI
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: AWS_REGION
            - name: AWS_S3_BUCKET
              value: {{ .Values.aws.s3Bucket | quote }}
            - name: CLIENT_URL
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: CLIENT_URL
            - name: CLIENT_URLS
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: CLIENT_URLS
            - name: STREAMING_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: STREAMING_PUBLIC_URL
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.services.streaming.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.services.streaming.port }}
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: streaming-service
  namespace: {{ .Values.global.namespace }}
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.streaming.port }}
      targetPort: {{ .Values.services.streaming.port }}
      name: http
  selector:
    app: streaming-service
