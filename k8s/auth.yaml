apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: streamingapp
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 087666071191.dkr.ecr.us-east-1.amazonaws.com/streaming-auth:1.0.0
          imagePullPolicy: Always

          ports:
            - containerPort: 3001
              name: http

          env:
            - name: PORT
              value: "3001"

            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: MONGO_URI

            - name: CLIENT_URL
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: CLIENT_URL

            - name: CLIENT_URLS
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: CLIENT_URLS

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamingapp-secrets
                  key: JWT_SECRET

            - name: JWT_EXPIRES_IN
              value: "1d"

          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: streamingapp
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP